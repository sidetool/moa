name: Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: pnpm --filter @moa/extensions --filter @moa/subtitles-ko --filter @moa/skip-markers build
      - run: pnpm typecheck
      - run: node --test scripts/update.test.mjs scripts/release.test.mjs scripts/release-updater.test.mjs scripts/install-release.test.mjs scripts/container-updater.test.mjs scripts/release-artifacts.test.mjs
      - run: pnpm --filter @moa/server exec tsx --test test/updates.test.ts test/updates-release.test.ts test/source-session.test.ts test/source-browser.test.ts test/source-network.test.ts
      - name: Device settings, subtitles and sessions
        run: |
          pnpm --filter @moa/server exec tsx --test test/device-settings.test.ts test/subtitle-library.test.ts test/playback-preview.test.ts
          node --test deploy/auth/*.test.mjs
      - name: Trailer feed, saved list and recommendation regressions
        run: pnpm --filter @moa/server exec tsx --test test/home.test.ts test/kids.test.ts test/watchlist-reader.test.ts test/recommendations.test.ts test/downloads.test.ts test/tmdb-trailers.test.ts test/youtube-trailers.test.ts test/shorts.test.ts test/shorts-native.test.ts test/translation.test.ts
      - name: Source playback integration
        run: pnpm --filter @moa/server exec tsx --test test/inline-hls.test.ts test/sources.test.ts test/source-identity.test.ts test/source-addresses.test.ts test/apk-sources.test.ts test/history.test.ts test/domain.test.ts
      - name: Plugin history, discovery and people contracts
        run: |
          pnpm --filter @moa/server exec tsx --test test/history-reader.test.ts test/plugin-discovery.test.ts test/plugin-people.test.ts test/website-plugins.test.ts
          node --test plugins/title-people/test/plugin.test.mjs
      - run: pnpm --filter @moa/web build
      - name: Isolated Docker update and rollback
        run: |
          docker pull node:22-bookworm-slim
          node scripts/verify-release-docker.mjs --run
